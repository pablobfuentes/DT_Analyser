name: Windows .exe

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend + PyInstaller
        working-directory: backend
        run: |
          python -m pip install -r requirements-build.txt

      - name: PyInstaller
        run: |
          pyinstaller --noconfirm --distpath packaging/dist --workpath packaging/build packaging/dt_analyser.spec
          Copy-Item packaging/START_HERE.txt packaging/dist/DT_Analyser/START_HERE.txt

      - name: Zip
        run: Compress-Archive -Path packaging/dist/DT_Analyser/* -DestinationPath packaging/dist/DT_Analyser.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DT_Analyser-windows
          path: packaging/dist/DT_Analyser.zip

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/DT_Analyser.zip
