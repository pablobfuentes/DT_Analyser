[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# SPA + API proxy rules are generated at build time in frontend/public/_redirects
# (see frontend/scripts/prebuild.mjs). Set BACKEND_URL in Netlify env vars.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
